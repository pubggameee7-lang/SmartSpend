<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSpend - Budget Assistant</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="chat-page">
  <a href="#chat-box" class="skip-link">Skip to chat</a>
  <header class="header" role="banner">
    <div class="header-left">
      <h1 class="logo">Smart<span>Spend</span></h1>
      <p class="disclaimer">Not a financial advisor - for educational purposes only.</p>
    </div>
    <div class="header-right">
      <span id="user-email" class="user-email" aria-live="polite"></span>
      <button id="dark-mode-btn" class="btn-outline" aria-label="Toggle dark mode" style="font-size:16px;padding:6px 12px;">🌙</button>
      <a href="dashboard.html" class="btn-secondary" aria-label="Go to Dashboard">Dashboard</a>
      <button id="logout-btn" class="btn-outline" aria-label="Log out of SmartSpend">Log Out</button>
    </div>
  </header>
  <div class="chat-layout">
    <aside class="sidebar" role="navigation" aria-label="Chat sessions">
      <button id="new-session-btn" class="btn-primary full-width">+ New Chat</button>
      <div class="sidebar-search">
        <input type="text" id="session-search" placeholder="🔍 Search chats..." />
      </div>
      <div id="session-list" class="session-list" role="list"></div>
    </aside>
    <main class="chat-main" role="main">
      <div id="chat-box" class="chat-box" role="log" aria-live="polite" tabindex="0"></div>
      <div id="quick-replies-container" class="quick-replies-container" role="group"></div>
      <div class="input-area">
        <label for="user-input" class="sr-only">Type your message</label>
        <textarea id="user-input" placeholder="Type your message here..." rows="2" aria-label="Type your message to SmartSpend"></textarea>
        <button id="send-btn" class="btn-primary">Send</button>
      </div>
    </main>
  </div>
  <!-- Search Modal -->
  <div id="search-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;align-items:flex-start;justify-content:center;padding-top:80px;">
    <div style="background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);width:100%;max-width:560px;overflow:hidden;">
      <div style="padding:12px 16px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:8px;">
        <span style="font-size:16px;">🔍</span>
        <input id="search-modal-input" type="text" placeholder="Search all chats..." style="flex:1;border:none;outline:none;font-family:Poppins,sans-serif;font-size:14px;color:var(--text);background:transparent;" />
        <button id="search-modal-close" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-muted);">✕</button>
      </div>
      <div id="search-modal-results" style="max-height:400px;overflow-y:auto;"></div>
    </div>
  </div>
  <script src="js/chat.js"></script>
</body>
</html>
