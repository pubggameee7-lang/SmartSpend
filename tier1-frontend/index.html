<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSpend - Budget Assistant</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="chat-page">
  <a href="#chat-box" class="skip-link">Skip to chat</a>
  <header class="header" role="banner">
    <div class="header-left">
      <h1 class="logo">Smart<span>Spend</span></h1>
      <p class="disclaimer">Not a financial advisor - for educational purposes only.</p>
    </div>
    <div class="header-right">
      <span id="user-email" class="user-email" aria-live="polite"></span>
      <a href="dashboard.html" class="btn-secondary" aria-label="Go to Dashboard">Dashboard</a>
      <button id="logout-btn" class="btn-outline" aria-label="Log out of SmartSpend">Log Out</button>
    </div>
  </header>
  <div class="chat-layout">
    <aside class="sidebar" role="navigation" aria-label="Chat sessions">
      <button id="new-session-btn" class="btn-primary full-width">+ New Chat</button>
      <div class="sidebar-search">
        <input type="text" id="session-search" placeholder="🔍 Search chats..." />
      </div>
      <div id="session-list" class="session-list" role="list"></div>
    </aside>
    <main class="chat-main" role="main">
      <div id="chat-box" class="chat-box" role="log" aria-live="polite" tabindex="0"></div>
      <div id="quick-replies-container" class="quick-replies-container" role="group"></div>
      <div class="input-area">
        <label for="user-input" class="sr-only">Type your message</label>
        <textarea id="user-input" placeholder="Type your message here..." rows="2" aria-label="Type your message to SmartSpend"></textarea>
        <button id="send-btn" class="btn-primary">Send</button>
      </div>
    </main>
  </div>
  <script src="js/chat.js"></script>
</body>
</html>
